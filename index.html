<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đấu Trường Phép Thuật</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
</head>
<body>
<!-- Đấu phép tốc độ kiểu game đối kháng: HUD đối xứng trên cùng, sân khấu ngang (bạn trái, máy phải), thanh niệm và 4 lá phép bên dưới -->
<div class="duel">
  <header class="d-top">
    <h1 class="d-title">Đấu Trường <span>Phép Thuật</span></h1>
    <div class="weather" id="dWeather"></div>
  </header>
  <div class="d-hud">
    <div class="hud me" id="hMe"></div>
    <div class="h-mid"><span class="d-time" id="dTime">0:00</span></div>
    <div class="hud opp" id="hOpp"></div>
  </div>
  <div class="board d-stage" data-weather="clear">
    <div class="st-sky"></div><div class="st-hills"></div><div class="st-floor"></div>
    <div class="fighter me" id="fMe"></div>
    <div class="fighter opp" id="fOpp"></div>
    <canvas id="dFx" class="d-fx"></canvas>
    <div id="dClash" class="d-clash" hidden>
      <div class="beam me"></div><div class="beam opp"></div><div class="flare"></div>
      <div class="d-cbox"><div class="d-push"><i></i></div><div class="meta">Bấm <b>Space</b> (hoặc chạm sân) thật nhanh · còn <b id="dClashT">0</b>s</div></div>
    </div>
    <div id="dBanner" class="d-banner"></div>
  </div>
  <div class="d-hand" id="dHand"></div>
</div>
<div id="dOverlay"></div>
<script type="module" src="/src/duel/duel.js"></script>
</body>
</html>
