<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đấu Trường Phép Thuật</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <style id="artcss"></style>
</head>
<body class="view-3d">
<div class="app">
  <div class="head">
    <h1>Đấu Trường <span>Phép Thuật</span></h1>
    <div class="row"><button class="btn sm" id="viewBtn" aria-pressed="true">Góc nhìn: Nghiêng</button><button class="btn sm" data-newgame="1">Chọn bộ bài</button><button class="btn sm" id="openLib">Kho lá bài</button></div>
  </div>
  <!-- Màn chơi kiểu Tag Force: HUD đối thủ trên, sân nghiêng giữa, bảng lệnh bên phải, bài trên tay xoè ngay trong màn -->
  <div class="board">
    <div class="hud top">
      <div class="info" id="oppInfo"></div>
      <div class="opphand" id="oppHand"></div>
    </div>
    <div class="phases" id="turnline"></div>
    <div class="field3d"><div class="plane">
      <div class="zone opp"><span class="zlabel">Phép</span><span id="oppST" style="display:contents"></span></div>
      <div class="zone z3 opp"><span class="zlabel">Linh thú</span><span id="oppFam" style="display:contents"></span></div>
      <div class="midline"></div>
      <div class="zone z3 me"><span class="zlabel">Linh thú</span><span id="myFam" style="display:contents"></span></div>
      <div class="zone me"><span class="zlabel">Phép</span><span id="myST" style="display:contents"></span></div>
    </div></div>
    <div class="strip">
      <div class="chain" id="chain"></div>
      <div id="tip"></div>
      <div class="prompt" id="prompt"></div>
    </div>
    <div class="hand" id="myHand"></div>
    <div class="hud bottom"><div class="info" id="myInfo"></div></div>
  </div>
</div>
<div id="overlay"></div>
<div id="cardmenu" class="cardmenu" role="menu" hidden></div>
<div id="cardinfo" class="cardinfo" hidden></div>
<div id="deckpick" class="lib" hidden></div>
<div id="lib" class="lib" hidden></div>
<input type="file" id="artFile" accept="image/*" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
